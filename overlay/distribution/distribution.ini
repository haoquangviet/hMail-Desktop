# hMail Desktop distribution configuration (MIT License, HQV Software)
# All three Global keys are mandatory or the whole file is ignored.
[Global]
id=hmail-desktop
version=0.1
about=hMail Desktop by HQV Software - based on Mozilla Thunderbird open source code. hMail Desktop and Thunderbird are not officially associated with Mozilla or its products. Source: https://github.com/haoquangviet/hMail-Desktop

[Preferences]
# --- Outlook-like layout defaults (user can still change) ---
mail.pane_config.dynamic=2
mail.threadpane.listview=0
mail.threadpane.cardsview.rowcount=3
mail.uidensity=0
mail.threadpane.use_correspondents=true
mail.tabs.drawInTitlebar=false
toolbar.unifiedtoolbar.buttonstyle=1

# --- Storage: maildir (one file per message) for all new accounts ---
mail.serverDefaultStoreContractID="@mozilla.org/msgstore/maildirstore;1"

# --- Feature trimming ---
mail.chat.enabled=false
mailnews.start_page.enabled=true
mailnews.start_page.url=https://haoquangviet.github.io/hMail-Desktop/start.html
mail.inappnotifications.enabled=false

# --- Privacy: no Mozilla data endpoints ---
datareporting.healthreport.uploadEnabled=false
datareporting.policy.dataSubmissionEnabled=false
toolkit.telemetry.enabled=false
toolkit.telemetry.unified=false
browser.search.update=false

# --- userChrome styling enabled (also locked via policies.json) ---
toolkit.legacyUserProfileCustomizations.stylesheets=true
