// Mozilla's configuration channel.
//
// hMail used to blank services.settings.server to keep the application from
// talking to Mozilla. That never worked: on a release build Gecko refuses any
// override of this address unless MOZ_REMOTE_SETTINGS_DEVTOOLS is set in the
// environment, logs "Ignoring preference override of remote settings server",
// and carries on using the built-in address regardless. The pref was doing
// nothing except making the log look alarming — and it was blamed for the
// on-device AI failing to fetch its ONNX runtime.
//
// So: leave the address alone, and set the environment variable that makes an
// override legal, in case anything here ever needs to point somewhere else.
// This runs before Remote Settings is first touched, and the check is a lazy
// getter, so setting it here is early enough.
try {
  Services.env.set("MOZ_REMOTE_SETTINGS_DEVTOOLS", "1");
} catch (e) {}
