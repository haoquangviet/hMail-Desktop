// Third-party extensions are turned away at the door, but not by listing
// policies.json ExtensionSettings["*"] as "blocked": Thunderbird's policy
// engine treats every extension matching an ExtensionSettings entry as
// administrator-managed, wildcard included, which strips the Add-ons
// Manager's enable/remove controls even for extensions the user already
// had before this policy shipped (a migrated profile, one from a plain
// Thunderbird install, etc.) - so "Xoá" silently stops working for
// anything that slipped in. xpinstall.enabled instead only gates the
// interactive install path (drag-and-drop, AMO, "Install Add-on From
// File"): new installs still get turned away, but an add-on that is
// already on disk stays a normal, fully removable add-on. The bundled
// assistant is unaffected - hmail.cfg installs it straight through
// AddonManager.getInstallForFile() with chrome privileges, which this
// pref does not gate.
lockPref("xpinstall.enabled", false);

