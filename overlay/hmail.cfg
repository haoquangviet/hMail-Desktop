// ------------------------------------------------- keep hMail AI up to date
// Extensions dropped in distribution/extensions are installed once, when a
// profile is first created. An existing profile therefore keeps whatever
// version it got on day one, and a shipped add-on update never reaches it.
// Compare the bundled file against what is installed and install it when they
// differ.
try {
  const { AddonManager } = ChromeUtils.importESModule(
    "resource://gre/modules/AddonManager.sys.mjs"
  );
  const HMAIL_AI_ID = "hmail-ai@hqvsoftware.com";

  let xpi = Services.dirsvc.get("GreD", Ci.nsIFile);
  xpi.append("distribution");
  xpi.append("extensions");
  xpi.append(HMAIL_AI_ID + ".xpi");

  // AddonManager is not up yet when autoconfig runs, so this waits for the
  // first mail window instead of firing immediately.
  var hmailUpdateAssistant = function () {
    if (hmailUpdateAssistant.done || !xpi.exists()) {
      return;
    }
    hmailUpdateAssistant.done = true;
    (async () => {
      try {
        // Read the bundled version straight out of the archive.
        const zipReader = Cc["@mozilla.org/libjar/zip-reader;1"]
          .createInstance(Ci.nsIZipReader);
        zipReader.open(xpi);
        const stream = zipReader.getInputStream("manifest.json");
        const converter = Cc["@mozilla.org/intl/converter-input-stream;1"]
          .createInstance(Ci.nsIConverterInputStream);
        converter.init(stream, "UTF-8", 0, 0);
        let text = "";
        const chunk = {};
        while (converter.readString(4096, chunk) !== 0) {
          text += chunk.value;
        }
        converter.close();
        zipReader.close();
        const bundledVersion = JSON.parse(text).version;

        const installed = await AddonManager.getAddonByID(HMAIL_AI_ID);
        if (installed && installed.version === bundledVersion) {
          Services.prefs.setCharPref("hmail.ai.updateState",
                                     "current " + bundledVersion);
          return;
        }
        const install = await AddonManager.getInstallForFile(
          xpi, null, { source: "distribution" });
        if (!install) {
          Services.prefs.setCharPref("hmail.ai.updateState", "no install object");
          return;
        }
        await install.install();
        Services.prefs.setCharPref("hmail.ai.updateState",
                                   "installed " + bundledVersion +
                                   " state=" + install.state);
      } catch (e) {
        Services.prefs.setCharPref("hmail.ai.updateState", "error: " + e);
        Cu.reportError("hMail AI update check failed: " + e);
      }
    })();
  };
} catch (e) {
  Cu.reportError("hMail AI updater setup failed: " + e);
}

// ------------------------------------------- pre-grant hMail AI permissions
// The assistant asks the user to approve host access to the AI providers
// before it will do anything. In a managed build that prompt is pure friction:
// we chose the add-on and we chose which providers it may reach, so grant
// exactly those origins up front. Nothing broader is granted — no <all_urls>.
try {
  const { ExtensionPermissions } = ChromeUtils.importESModule(
    "resource://gre/modules/ExtensionPermissions.sys.mjs"
  );
  const HMAIL_AI_ID = "hmail-ai@hqvsoftware.com";
  const HMAIL_AI_ORIGINS = [
    "https://*.chatgpt.com/*",
    "https://*.openai.com/*",
    "https://*.anthropic.com/*",
  ];
  const HMAIL_AI_PERMS = ["addressBooks", "messagesTags", "messagesUpdate", "messagesMove"];

  let granted = "";
  try {
    granted = Services.prefs.getCharPref("hmail.ai.permissionsGranted");
  } catch (e) {}

  if (granted !== "1") {
    ExtensionPermissions.add(HMAIL_AI_ID, {
      permissions: HMAIL_AI_PERMS,
      origins: HMAIL_AI_ORIGINS,
    }).then(() => {
      Services.prefs.setCharPref("hmail.ai.permissionsGranted", "1");
    }, e => Cu.reportError("hMail AI permission grant failed: " + e));
  }
} catch (e) {
  Cu.reportError("hMail AI permission setup failed: " + e);
}

// ------------------------- alarm dismissal survives a server-refused PUT
// Google's CalDAV endpoint refuses any PUT to its auto-generated events
// (birthdays, holidays) with a plain 400 — including a PUT whose only change
// is X-MOZ-LASTACK, the private marker Thunderbird stores on an event when
// its reminder is dismissed or snoozed. Stock behaviour treats that as a
// failed modification: the ack never reaches the local cache, the same
// "Chúc mừng sinh nhật!" reminder pops up forever, and every dismiss throws
// a MODIFICATION_FAILED dialog that blames the whole calendar.
//
// When the server turns down a change that is nothing but alarm bookkeeping,
// accept it locally instead: report success to the cached-calendar layer so
// it stores the acked copy. The failed PUT left the server copy and its etag
// untouched, so the next sync has no reason to pull the un-acked version
// back over the cache — the dismissal survives restarts. Anything beyond
// alarm bookkeeping still fails as loudly as before, and a genuinely
// unreachable server (NS_ERROR_NOT_AVAILABLE) still goes through the
// offline-replay path, which retries once the connection returns.
try {
  const { CalDavCalendar } = ChromeUtils.importESModule(
    "resource:///modules/CalDavCalendar.sys.mjs"
  );

  // True when new and old serialize identically once the properties an
  // alarm ack touches are ignored. Only parent items are considered: an
  // ack always lands on the parent, and a serialized comparison of an
  // exception's parent could mistake a real edit for bookkeeping.
  const hmailAckOnlyChange = (calendar, newItem, oldItem) => {
    try {
      if (!newItem || !oldItem ||
          newItem.parentItem != newItem || oldItem.parentItem != oldItem) {
        return false;
      }
      const strip = ics => ics
        .replace(/\r?\n[ \t]/g, "")
        .split(/\r?\n/)
        .filter(line =>
          !/^(?:X-MOZ-LASTACK|X-MOZ-SNOOZE-TIME[^:;]*|X-MOZ-GENERATION|LAST-MODIFIED|DTSTAMP)[;:]/i
            .test(line))
        .sort()
        .join("\n");
      return strip(calendar.getSerializedItem(newItem)) ===
             strip(calendar.getSerializedItem(oldItem));
    } catch (e) {
      return false;
    }
  };

  const hmailOrigDoModifyItem = CalDavCalendar.prototype.doModifyItem;
  CalDavCalendar.prototype.doModifyItem = function (
    aNewItem, aOldItem, aListener, aIgnoreEtag) {
    let listener = aListener;
    // Without a cache there is nowhere for a local-only ack to live.
    if (aListener && this.isCached) {
      const calendar = this;
      listener = {
        get wrappedJSObject() {
          return this;
        },
        onOperationComplete(aCalendar, aStatus, aOpType, aId, aDetail) {
          if (!Components.isSuccessCode(aStatus) &&
              aStatus != Components.results.NS_ERROR_NOT_AVAILABLE &&
              hmailAckOnlyChange(calendar, aNewItem, aOldItem)) {
            Cu.reportError(
              "hMail calendar: " + calendar.name +
              " refused an alarm-only change (" + aDetail +
              "); keeping the dismissal locally.");
            aStatus = Components.results.NS_OK;
            aDetail = aNewItem;
          }
          return aListener.onOperationComplete(
            aCalendar, aStatus, aOpType, aId, aDetail);
        },
      };
    }
    return hmailOrigDoModifyItem.call(
      this, aNewItem, aOldItem, listener, aIgnoreEtag);
  };
} catch (e) {
  Cu.reportError("hMail calendar ack patch failed: " + e);
}

// ------------------------------- phiên bản hMail trong trang Trình gỡ lỗi
// about:debugging (devtools) chào người dùng bằng "hMail Desktop (140.13.0)"
// — tên đã đúng nhờ branding, còn con số là bản Thunderbird nền lấy thẳng từ
// appinfo. Trang là React, vẽ lại theo route, nên sửa bằng cách canh DOM và
// thay chuỗi mỗi khi nó xuất hiện; các trang tĩnh hơn (Giới thiệu, Thông tin
// gỡ rối) đã được vá ngay trong omni.ja lúc build.
try {
  const hmailFixDebuggingDoc = doc => {
    const win = doc.defaultView;
    if (!win || win._hmailVerFix) {
      return;
    }
    win._hmailVerFix = true;
    const tick = () => {
      try {
        const v = Services.prefs.getCharPref("hmail.version", "");
        if (!v) {
          return;
        }
        // Only the exact platform version in parentheses is fair game —
        // an earlier looser pattern also "fixed" the extension count in
        // "Tiện ích mở rộng (1)". And keep the replacement short: the
        // page's headline column is narrow, long text wraps one word per
        // line. The Thunderbird base version stays visible in the About
        // and Troubleshooting pages.
        const base = Services.appinfo.version.replace(/esr$/i, "");
        const marker = new RegExp(
          "\\(\\s*" + base.replace(/\./g, "\\.") + "(?:esr)?\\s*\\)");
        for (const node of doc.querySelectorAll("h1, h2")) {
          if (!marker.test(node.textContent || "")) {
            continue;
          }
          // Only the text NODE carrying the number is touched — writing
          // textContent on the heading itself threw away its child
          // elements (the runtime icon) and broke the line into pieces.
          const walker = doc.createTreeWalker(node, 4 /* SHOW_TEXT */);
          let text;
          while ((text = walker.nextNode())) {
            if (marker.test(text.data)) {
              text.data = text.data.replace(marker, `(${v})`);
            }
          }
        }
      } catch (e) {}
    };
    win.setInterval(tick, 1500);
    win.setTimeout(tick, 500);
  };
  Services.obs.addObserver({
    observe(subject) {
      try {
        if (String(subject?.documentURI || "").startsWith("about:debugging")) {
          hmailFixDebuggingDoc(subject);
        }
      } catch (e) {}
    },
  }, "document-element-inserted", false);
} catch (e) {
  Cu.reportError("hMail debugging version fixup failed: " + e);
}

// ----------------------- công cụ tìm kiếm: bỏ Cốc Cốc
// Bộ máy vi của Thunderbird đóng gói sẵn Cốc Cốc (kèm mã utm_source ghi công
// cho Mozilla). hMail không phân phối công cụ đó — gỡ khỏi danh sách; người
// dùng muốn vẫn tự thêm lại được bằng nút "Thêm…" trong Cài đặt.
try {
  Services.search.promiseInitialized.then(async () => {
    try {
      const engine = await Services.search.getEngineByName("Cốc Cốc");
      if (engine && !engine.hidden) {
        await Services.search.removeEngine(engine);
      }
    } catch (e) {}
  }).catch(() => {});
} catch (e) {
  Cu.reportError("hMail search cleanup failed: " + e);
}

// ----------------------- nút mở trình tạo chữ ký trong Cài đặt tài khoản
// Ô chữ ký của Thunderbird bắt người dùng tự viết HTML. Trang định danh
// (am-main.xhtml, nằm trong iframe của Cài đặt tài khoản) được gắn thêm một
// nút mở tab "Chữ ký thư" — trình soạn trực quan trong signature.js.
try {
  Services.obs.addObserver({
    observe(subject) {
      try {
        const doc = subject;
        if (!String(doc?.documentURI || "").includes("am-main.xhtml")) {
          return;
        }
        doc.defaultView.setTimeout(() => {
          try {
            const sig = doc.getElementById("identity.htmlSigText");
            if (!sig || doc.getElementById("hmail-sig-open")) {
              return;
            }
            const btn = doc.createElementNS(
              "http://www.w3.org/1999/xhtml", "button");
            btn.id = "hmail-sig-open";
            btn.textContent = "Tạo chữ ký trực quan…";
            btn.style.cssText = "margin: 6px 0; padding: 4px 14px;";
            btn.addEventListener("click", event => {
              event.preventDefault();
              const email = doc.getElementById("identity.email")?.value || "";
              Services.wm.getMostRecentWindow("mail:3pane")
                ?.hMailSignature?.openTab(email);
            });
            sig.parentNode.insertBefore(btn, sig);
          } catch (e) {}
        }, 400);
      } catch (e) {}
    },
  }, "document-element-inserted", false);
} catch (e) {
  Cu.reportError("hMail signature button failed: " + e);
}

// ---------------------- nút "Tài khoản mới" đi thẳng vào thêm tài khoản thư
// Cài đặt tài khoản kế thừa menu ba lựa chọn của Thunderbird (thư / nguồn
// cấp / nhóm tin). hMail chỉ làm tài khoản thư, nên menu một-lựa-chọn là
// một cú click thừa: nút gọi thẳng openAccountSetup() — đúng lệnh mà mục
// "Tài khoản thư…" gọi; các mục thừa được hmail-agent.css giấu nốt cho lối
// vào bằng bàn phím.
try {
  Services.obs.addObserver({
    observe(subject) {
      try {
        const doc = subject;
        if (!String(doc?.documentURI || "")
              .startsWith("about:accountsettings")) {
          return;
        }
        const win = doc.defaultView;
        win.setTimeout(() => {
          try {
            doc.addEventListener("click", event => {
              if (!event.target?.closest?.("#accountTreeCreateAccount")) {
                return;
              }
              // Capture trên document chạy trước listener mở menu của
              // chính nút, nên menu không kịp bung.
              event.stopPropagation();
              event.preventDefault();
              try {
                win.openAccountSetup();
              } catch (e) {
                Cu.reportError("hMail account setup open failed: " + e);
              }
            }, true);
          } catch (e) {}
        }, 300);
      } catch (e) {}
    },
  }, "document-element-inserted", false);
} catch (e) {
  Cu.reportError("hMail account-add shortcut failed: " + e);
}

// ------------------------------------------------- hmail:// deep links
// Windows hands hmail:// links to the executable as
// `hmail.exe -osint -hmail-url "<link>"` (see the installer). A second
// launch is forwarded to the running instance, so this handler serves both
// cold starts and clicks while the app is open. hmail://oauth carries an
// OAuth redirect from a system-browser sign-in; anything else just brings
// the mail window forward.
try {
  const urlHandler = {
    handle(cmdLine) {
      let url = null;
      try {
        url = cmdLine.handleFlagWithParam("hmail-url", false);
      } catch (e) {}
      if (!url) {
        // The link may also arrive bare (`hmail.exe hmail://oauth?...`) or
        // behind -url — the ONLY flag shape that survives being forwarded
        // to a running instance (Gecko allowlists remote flags; the custom
        // -hmail-url is dropped there, see backlog #7). When taking the
        // URL, take its -url/-osint escorts with it or the default
        // handler chokes on a dangling flag.
        for (let i = 0; i < cmdLine.length; i++) {
          if (/^hmail:/i.test(cmdLine.getArgument(i))) {
            url = cmdLine.getArgument(i);
            let first = i;
            while (first > 0 &&
                   /^-(url|osint|hmail-url)$/i
                     .test(cmdLine.getArgument(first - 1))) {
              first--;
            }
            cmdLine.removeArguments(first, i);
            break;
          }
        }
      }
      if (!url) {
        return;
      }
      cmdLine.preventDefault = true;
      // Dấu vết chẩn đoán: lệnh có TỚI handler hay không là câu hỏi đầu
      // tiên mỗi lần "hmail://quit không ăn" (backlog #7).
      try {
        Services.prefs.setCharPref("hmail.debug.cmdline",
          Date.now() + " " + url);
      } catch (e) {}
      try {
        if (/^hmail:\/*oauth/i.test(url)) {
          Services.obs.notifyObservers(null, "hmail-oauth-callback", url);
        }
        const win = Services.wm.getMostRecentWindow("mail:3pane");
        // The tray icon speaks through this handler: its menu items are
        // links, so the icon needs no privileges and no knowledge of mail.
        if (/^hmail:\/*quit/i.test(url)) {
          // eForceQuit tường minh: các hằng này KHÔNG phải bitflag —
          // eAttemptQuit(2) | eForceQuit(3) tình cờ vẫn ra 3 nhưng đọc sai.
          Services.startup.quit(Services.startup.eForceQuit);
          return;
        }
        if (/^hmail:\/*compose/i.test(url) && win) {
          try {
            win.MsgNewMessage(null);
          } catch (e) {
            Cu.reportError("hMail compose from tray failed: " + e);
          }
        }
        if (win) {
          // Restoring first: a minimised window that is only focused stays
          // minimised, which reads as the click having done nothing.
          try {
            if (win.windowState === win.STATE_MINIMIZED) {
              win.restore();
            }
          } catch (e) {}
          win.focus();
        }
      } catch (e) {
        Cu.reportError("hMail url handler failed: " + e);
      }
    },
    helpInfo: "  -hmail-url <url>   Open an hmail:// link.\n",
    QueryInterface: ChromeUtils.generateQI(["nsICommandLineHandler"]),
  };
  const contract = "@hqvsoftware.com/hmail-url-handler;1";
  Components.manager
    .QueryInterface(Ci.nsIComponentRegistrar)
    .registerFactory(
      Components.ID("{5e2f7c74-9b1a-4f3e-8b60-1b2f0c9a7d41}"),
      "hMail URL Handler", contract, {
        createInstance(iid) {
          return urlHandler.QueryInterface(iid);
        },
      });
  Services.catMan.addCategoryEntry(
    "command-line-handler", "a-hmail-url", contract, false, true);
} catch (e) {
  Cu.reportError("hMail url handler setup failed: " + e);
}

// ------------------------------------------------- Outlook-style ribbon
// Autoconfig already runs with chrome privileges, so the ribbon can be injected
// into each mail window directly — no add-on, and omni.ja stays untouched.
try {
  const hmailChromeScript = function (leaf) {
    let f = Services.dirsvc.get("GreD", Ci.nsIFile);
    f.append("hmail-ribbon");
    f.append(leaf);
    return Services.io.newFileURI(f).spec;
  };
  const HMAIL_RIBBON = hmailChromeScript("ribbon.js");
  const HMAIL_SIDEBAR = hmailChromeScript("sidebar.js");
  const HMAIL_SPAM = hmailChromeScript("spamreport.js");
  const HMAIL_AI = hmailChromeScript("aiassistant.js");
  const HMAIL_AI_ACTIONS = hmailChromeScript("aiassistant-actions.js");
  const HMAIL_AI_UI = hmailChromeScript("aiassistant-ui.js");
  const HMAIL_COMPOSE_AI = hmailChromeScript("compose-ai.js");
  const HMAIL_DAV = hmailChromeScript("davsync.js");
  const HMAIL_GSYNC = hmailChromeScript("gsync.js");
  const HMAIL_MEET = hmailChromeScript("meetings.js");
  const HMAIL_DIAG = hmailChromeScript("diagnostics.js");
  const HMAIL_INSIGHT = hmailChromeScript("mailinsight.js");
  const HMAIL_MERGE = hmailChromeScript("mailmerge.js");
  const HMAIL_QUICKREPLY = hmailChromeScript("quickreply.js");
  const HMAIL_COMPOSE_RIBBON = hmailChromeScript("compose-ribbon.js");
  const HMAIL_LOCALAI = hmailChromeScript("localai.js");
  const HMAIL_LOCALAI_UI = hmailChromeScript("localai-ui.js");
  const HMAIL_UPDATE = hmailChromeScript("updates.js");
  const HMAIL_BACKGROUND = hmailChromeScript("background.js");
  const HMAIL_PST = hmailChromeScript("pstreader.js");
  const HMAIL_IMPORT = hmailChromeScript("outlook-import.js");
  const HMAIL_SENDERID = hmailChromeScript("senderid.js");
  const HMAIL_SERVERFILTER = hmailChromeScript("serverfilter.js");
  const HMAIL_LOADING = hmailChromeScript("loading.js");
  const HMAIL_BUSY = hmailChromeScript("busy.js");
  const HMAIL_HUB = hmailChromeScript("accounthub.js");
  const HMAIL_FLOW = hmailChromeScript("aiflow.js");
  const HMAIL_FLOW_UI = hmailChromeScript("aiflow-ui.js");
  const HMAIL_TRANSLATE = hmailChromeScript("translate.js");
  const HMAIL_MSG = hmailChromeScript("msgreader.js");
  const HMAIL_SIGNATURE = hmailChromeScript("signature.js");
  const HMAIL_SPACES = hmailChromeScript("spaces.js");

  const hmailWindowObserver = {
    observe(subject, topic) {
      if (topic !== "domwindowopened") {
        return;
      }
      const win = subject;
      win.addEventListener("load", function onLoad() {
        win.removeEventListener("load", onLoad);
        try {
          const type = win.document.documentElement.getAttribute("windowtype");

          // The composer gets the assistant too — drafting, translating and
          // rewriting happen here, not in the reading window.
          if (type === "msgcompose") {
            Services.scriptloader.loadSubScript(HMAIL_AI, win);
            Services.scriptloader.loadSubScript(HMAIL_AI_ACTIONS, win);
            Services.scriptloader.loadSubScript(HMAIL_AI_UI, win);
            Services.scriptloader.loadSubScript(HMAIL_COMPOSE_AI, win);
            if (win.hMailComposeAI) {
              win.hMailComposeAI.init(win);
            }
            Services.scriptloader.loadSubScript(HMAIL_MERGE, win);
            if (win.hMailMerge) {
              win.hMailMerge.initCompose(win);
            }
            // Every hMail command lives on a ribbon, in the composer too.
            Services.scriptloader.loadSubScript(HMAIL_COMPOSE_RIBBON, win);
            if (win.hMailComposeRibbon) {
              win.hMailComposeRibbon.init(win);
            }
            return;
          }

          // A message opened in its own window gets the assistant and the
          // local analysis too — same panel, docked beside the message.
          if (type === "mail:messageWindow") {
            Services.scriptloader.loadSubScript(HMAIL_SIDEBAR, win);
            if (win.hMailSidebar) {
              win.hMailSidebar.init(win);
            }
            Services.scriptloader.loadSubScript(HMAIL_AI, win);
            Services.scriptloader.loadSubScript(HMAIL_AI_ACTIONS, win);
            Services.scriptloader.loadSubScript(HMAIL_AI_UI, win);
            Services.scriptloader.loadSubScript(HMAIL_INSIGHT, win);
            if (win.hMailInsight) {
              win.hMailInsight.init(win);
            }
            if (win.hMailAI) {
              win.hMailAI.init(win);
            }
            Services.scriptloader.loadSubScript(HMAIL_QUICKREPLY, win);
            if (win.hMailQuickReply) {
              win.hMailQuickReply.init(win);
            }
            return;
          }

          if (type !== "mail:3pane") {
            return;
          }
          const sandbox = {};
          Services.scriptloader.loadSubScript(HMAIL_RIBBON, win);
          if (win.hMailRibbon) {
            win.hMailRibbon.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_SIDEBAR, win);
          if (win.hMailSidebar) {
            win.hMailSidebar.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_SPAM, win);
          if (win.hMailSpam) {
            win.hMailSpam.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_AI, win);
          Services.scriptloader.loadSubScript(HMAIL_AI_ACTIONS, win);
          Services.scriptloader.loadSubScript(HMAIL_AI_UI, win);
          if (win.hMailAI) {
            win.hMailAI.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_DAV, win);
          if (win.hMailDav) {
            win.hMailDav.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_GSYNC, win);
          if (win.hMailGSync) {
            win.hMailGSync.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_MEET, win);
          Services.scriptloader.loadSubScript(HMAIL_DIAG, win);
          if (win.hMailDiag) {
            win.hMailDiag.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_BACKGROUND, win);
          if (win.hMailBackground) {
            win.hMailBackground.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_INSIGHT, win);
          if (win.hMailInsight) {
            win.hMailInsight.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_QUICKREPLY, win);
          if (win.hMailQuickReply) {
            win.hMailQuickReply.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_UPDATE, win);
          if (win.hMailUpdate) {
            win.hMailUpdate.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_MERGE, win);
          if (win.hMailMerge) {
            win.hMailMerge.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_LOCALAI, win);
          Services.scriptloader.loadSubScript(HMAIL_LOCALAI_UI, win);
          Services.scriptloader.loadSubScript(HMAIL_SENDERID, win);
          if (win.hMailSenderId) {
            win.hMailSenderId.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_SERVERFILTER, win);
          if (win.hMailServerFilter) {
            win.hMailServerFilter.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_LOADING, win);
          if (win.hMailLoading) {
            win.hMailLoading.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_SPACES, win);
          if (win.hMailSpaces) {
            win.hMailSpaces.init(win);
          }
          // Loaded before anything that registers work with it.
          Services.scriptloader.loadSubScript(HMAIL_BUSY, win);
          if (win.hMailBusy) {
            win.hMailBusy.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_HUB, win);
          if (win.hMailAccountHub) {
            win.hMailAccountHub.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_FLOW, win);
          Services.scriptloader.loadSubScript(HMAIL_FLOW_UI, win);
          if (win.hMailFlow) {
            win.hMailFlow.init(win);
          }
          if (win.hMailFlowUI) {
            win.hMailFlowUI.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_TRANSLATE, win);
          if (win.hMailTranslate) {
            win.hMailTranslate.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_MSG, win);
          Services.scriptloader.loadSubScript(HMAIL_SIGNATURE, win);
          if (win.hMailLocalAIUI) {
            win.hMailLocalAIUI.init(win);
          }
          Services.scriptloader.loadSubScript(HMAIL_PST, win);
          Services.scriptloader.loadSubScript(HMAIL_IMPORT, win);
          if (win.hMailImport) {
            win.hMailImport.init(win);
          }
          // AddonManager is ready by now; keep the bundled assistant current.
          try {
            win.setTimeout(hmailUpdateAssistant, 3000);
          } catch (e) {}
        } catch (e) {
          Cu.reportError("hMail ribbon load failed: " + e);
        }
      });
    },
  };
  Services.ww.registerNotification(hmailWindowObserver);

  // Windows already open when this runs (rare, but possible on restart).
  const existing = Services.wm.getEnumerator("mail:3pane");
  while (existing.hasMoreElements()) {
    const win = existing.getNext();
    try {
      Services.scriptloader.loadSubScript(HMAIL_RIBBON, win);
      if (win.hMailRibbon) {
        win.hMailRibbon.init(win);
      }
    } catch (e) {
      Cu.reportError("hMail ribbon load (existing window) failed: " + e);
    }
  }
} catch (e) {
  Cu.reportError("hMail ribbon setup failed: " + e);
}

// ------------------------------------------- Outlook-style command bar
// Thunderbird ships an almost empty unified toolbar (spacer/search/spacer).
// Outlook's defining feature is the command bar across the top, so seed one.
// The layout lives in xulStore, not in a pref; seed it once and then leave the
// user's own customization alone.
try {
  const HMAIL_TOOLBAR_VERSION = "1";
  const DOC = "chrome://messenger/content/messenger.xhtml";

  let seeded = "";
  try {
    seeded = Services.prefs.getCharPref("hmail.toolbar.seeded");
  } catch (e) {}

  if (seeded !== HMAIL_TOOLBAR_VERSION) {
    // The mail space gets the search bar only: in Outlook the top strip is the
    // title bar with search, and every command lives in the ribbon below it.
    const layout = {
      mail: ["spacer", "search-bar", "spacer"],
      calendar: ["new-event", "new-task", "go-to-today", "spacer", "search-bar", "spacer"],
      tasks: ["new-task", "delete", "spacer", "search-bar", "spacer"],
      addressbook: [
        "create-contact",
        "create-address-book",
        "create-list",
        "import-contacts",
        "spacer",
        "search-bar",
        "spacer",
      ],
    };
    Services.xulStore.setValue(DOC, "unifiedToolbar", "state", JSON.stringify(layout));
    Services.prefs.setCharPref("hmail.toolbar.seeded", HMAIL_TOOLBAR_VERSION);
  }
} catch (e) {
  Cu.reportError("hMail toolbar seed failed: " + e);
}

// ---------------------------------------------------- deploy hMail UI theme
// Copies <install>/hmail-chrome/* into the active profile's chrome/ folder on
// every startup, so the Outlook-style userChrome.css is always present and
// up to date, for existing and new profiles alike.
try {
  let src = Services.dirsvc.get("GreD", Ci.nsIFile);
  src.append("hmail-chrome");
  if (src.exists()) {
    let dst = Services.dirsvc.get("ProfD", Ci.nsIFile);
    dst.append("chrome");
    if (!dst.exists()) {
      dst.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
    }
    for (let f of src.directoryEntries) {
      let t = dst.clone();
      t.append(f.leafName);
      if (t.exists()) {
        t.remove(true);
      }
      f.copyTo(dst, f.leafName);
    }
  }
} catch (e) {
  Cu.reportError("hMail chrome deploy failed: " + e);
}

// ------------------------------------------- stylesheet for sub-documents
// userChrome.css only reaches the top-level chrome document. The Settings
// page and friends live inside a <browser>, so their rules have to be
// registered with the style sheet service to reach them at all.
try {
  let sheet = Services.dirsvc.get("GreD", Ci.nsIFile);
  sheet.append("hmail-chrome");
  sheet.append("hmail-agent.css");
  if (sheet.exists()) {
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"]
      .getService(Ci.nsIStyleSheetService);
    const uri = Services.io.newFileURI(sheet);
    // Re-register on every start so an edited file takes effect.
    if (sss.sheetRegistered(uri, sss.USER_SHEET)) {
      sss.unregisterSheet(uri, sss.USER_SHEET);
    }
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  Cu.reportError("hMail agent sheet failed: " + e);
}

// --------------------------------------------- hộp cập nhật trong Cài đặt
// about:preferences is a document inside a <browser>, so the window observer
// above never sees it. This one does, and swaps Thunderbird's "updates are
// disabled by your administrator" box for hMail's own.
try {
  // hmailChromeScript lives inside the window-observer block above and is not
  // in scope here, so the path is built again rather than borrowed.
  const HMAIL_UPDATE_PREFS = (() => {
    const file = Services.dirsvc.get("GreD", Ci.nsIFile);
    file.append("hmail-ribbon");
    file.append("updates.js");
    return Services.io.newFileURI(file).spec;
  })();
  const HMAIL_BG_PREFS = (() => {
    const file = Services.dirsvc.get("GreD", Ci.nsIFile);
    file.append("hmail-ribbon");
    file.append("background.js");
    return Services.io.newFileURI(file).spec;
  })();
  // The Settings tab's documentURI is "about:preferences" in TB 140 — the
  // chrome:// form the redirector resolves to never shows up there, and
  // matching only that form is why the box silently stopped appearing.
  const isPrefsDoc = doc => {
    const uri = String(doc?.documentURI || "");
    return uri.startsWith("about:preferences") ||
           uri.includes("preferences/preferences.xhtml");
  };
  const prefsObserver = {
    observe(subject) {
      try {
        const doc = subject;
        if (!isPrefsDoc(doc)) {
          return;
        }
        const win = doc.defaultView;
        const paint = () => {
          try {
            const scope = {};
            Services.scriptloader.loadSubScript(HMAIL_UPDATE_PREFS, scope);
            scope.hMailUpdate?.renderPrefs(doc);
            // The background-mode switch belongs on the same page, beside
            // Thunderbird's own tray option.
            Services.scriptloader.loadSubScript(HMAIL_BG_PREFS, scope);
            scope.hMailBackground?.renderPrefs(doc);
          } catch (e) {
            Cu.reportError("hMail update prefs failed: " + e);
          }
        };
        // The update box is filled in after load, so wait a beat for it.
        win.setTimeout(paint, 600);
        win.setTimeout(paint, 2000);
      } catch (e) {}
    },
  };
  Services.obs.addObserver(prefsObserver, "chrome-document-loaded", false);
  // about:preferences lives in a content <browser>; depending on process
  // placement it may never pass through chrome-document-loaded. This topic
  // fires for every document once its root element exists — the URI is
  // final by then, and renderPrefs guards itself against double runs.
  Services.obs.addObserver(prefsObserver, "document-element-inserted", false);
} catch (e) {
  Cu.reportError("hMail update observer failed: " + e);
}

// ------------------------------------------------- hMail update channel (v1)
// Checks the hMail-Desktop GitHub Releases feed at most once a day, and offers
// to open the download page when a newer version is published. Replaces the
// disabled Mozilla update channel.
try {
  const HMAIL_RELEASES_API =
    "https://api.github.com/repos/haoquangviet/hMail-Desktop/releases/latest";
  const HMAIL_RELEASES_URL =
    "https://github.com/haoquangviet/hMail-Desktop/releases/latest";
  const DAY_SECONDS = 86400;

  let hmailVersion = "0.0.0";
  try {
    hmailVersion = Services.prefs.getCharPref("hmail.version");
  } catch (e) {}

  let now = Math.floor(Date.now() / 1000);
  let last = 0;
  try {
    last = Services.prefs.getIntPref("hmail.update.lastCheck");
  } catch (e) {}

  if (now - last > DAY_SECONDS) {
    Services.prefs.setIntPref("hmail.update.lastCheck", now);
    // Delay the check so it never slows down startup.
    let timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback(
      function () {
        try {
          let xhr = Cc[
            "@mozilla.org/xmlextras/xmlhttprequest;1"
          ].createInstance(Ci.nsIXMLHttpRequest);
          xhr.open("GET", HMAIL_RELEASES_API, true);
          xhr.setRequestHeader("Accept", "application/vnd.github+json");
          xhr.responseType = "json";
          xhr.onload = function () {
            try {
              if (xhr.status !== 200 || !xhr.response) {
                return;
              }
              let latest = String(xhr.response.tag_name || "").replace(/^v/, "");
              if (!latest) {
                return;
              }
              if (Services.vc.compare(latest, hmailVersion) > 0) {
                let win = Services.wm.getMostRecentWindow("mail:3pane");
                let flags =
                  Services.prompt.BUTTON_POS_0 *
                    Services.prompt.BUTTON_TITLE_IS_STRING +
                  Services.prompt.BUTTON_POS_1 *
                    Services.prompt.BUTTON_TITLE_IS_STRING;
                let choice = Services.prompt.confirmEx(
                  win,
                  "hMail Desktop",
                  "Đã có phiên bản hMail Desktop " + latest +
                    " (bạn đang dùng " + hmailVersion + ").\n" +
                    "Tải bản cập nhật từ trang phát hành chính thức?",
                  flags,
                  "Tải bản mới",
                  "Để sau",
                  null,
                  null,
                  {}
                );
                if (choice === 0) {
                  let uri = Services.io.newURI(HMAIL_RELEASES_URL);
                  Cc["@mozilla.org/uriloader/external-protocol-service;1"]
                    .getService(Ci.nsIExternalProtocolService)
                    .loadURI(uri);
                }
              }
            } catch (e) {
              Cu.reportError("hMail update check (onload): " + e);
            }
          };
          xhr.send();
        } catch (e) {
          Cu.reportError("hMail update check: " + e);
        }
      },
      15000,
      Ci.nsITimer.TYPE_ONE_SHOT
    );
  }
} catch (e) {
  Cu.reportError("hMail update scheduler: " + e);
}
